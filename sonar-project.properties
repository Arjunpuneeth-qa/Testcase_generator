# SonarQube Configuration

# Project identification
sonar.projectKey=Arjunpuneeth-qa_Testcase_generator
sonar.projectName=JIRA Test Case Generator
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.exclusions=node_modules/**,*.xlsx,GA_testcases/**/*.xlsx,.git/**,.github/**

# Language configuration
sonar.language=js
sonar.javascript.file.suffixes=.js,.ts
sonar.python.file.suffixes=.py

# Security configuration
sonar.security.enabled=true
sonar.security.scan=true

# Code coverage (optional, if you have coverage reports)
# sonar.coverage.exclusions=**/node_modules/**,**/test/**

# Quality gates
sonar.qualitygate.wait=true

# Verbose logging
sonar.verbose=true
